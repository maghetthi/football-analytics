name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: make venv
      - run: make lint

  # Runs the real pipeline end to end: migrations, ingestion, dbt build, then all tests (the API
  # and role tests need the built warehouse).
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Throwaway credentials for the ephemeral CI database; not secrets.
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: football_analytics
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      API_DB_PASSWORD: ci-only-reader-password
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: football_analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d football_analytics"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: make venv
      - run: make migrate
      - name: Ingest StatsBomb (World Cup 2022)
        run: make ingest-statsbomb
      - name: Ingest OpenLigaDB (UEFA club competitions)
        run: make ingest-openligadb
      - run: make dbt-deps
      - name: dbt build (models + data tests)
        run: make dbt-build
      - name: Evaluate club models and write predictions
        run: make predict-clubs
      - name: Tests (pipeline, API, read-only role)
        run: make test

  # The images must build: this is what gets deployed.
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f services/api/Dockerfile -t football-api .
      - run: docker build -f services/dashboard/Dockerfile -t football-dashboard .
