name: Daily ingest

# Inert until you opt in: set the repository variable INGEST_ENABLED=true and add the secrets below.
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC, after the provider's daily quota reset
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-football:
    if: vars.INGEST_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_SSLMODE: require
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      API_FOOTBALL_DAILY_BUDGET: "90"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python ".[flows]"
      # Free plans only expose seasons 2022-2024, so this ingests a whole season (1 request).
      - name: Ingest fixtures (1 request)
        run: >-
          .venv/bin/python -m football_pipeline.flows api-football
          --league "${{ vars.API_FOOTBALL_LEAGUE }}" --season "${{ vars.API_FOOTBALL_SEASON }}"
