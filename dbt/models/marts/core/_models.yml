version: 2

models:
  - name: dim_competition
    description: One row per competition (all seasons).
    columns:
      - name: competition_key
        data_tests: [unique, not_null]
      - name: source_competition_id
        data_tests: [unique, not_null]
      - name: competition_name
        data_tests: [not_null]

  - name: dim_season
    description: One row per season label (StatsBomb season_id maps 1:1 to season_name).
    columns:
      - name: season_key
        data_tests: [unique, not_null]
      - name: source_season_id
        data_tests: [unique, not_null]
      - name: season_name
        data_tests: [unique, not_null]
      - name: start_year
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 1850, max_value: 2100}

  - name: dim_team
    description: One row per team with its latest known name.
    columns:
      - name: team_key
        data_tests: [unique, not_null]
      - name: source_team_id
        data_tests: [unique, not_null]
      - name: team_name
        data_tests: [not_null]

  - name: dim_player
    description: One row per player with its latest known name.
    columns:
      - name: player_key
        data_tests: [unique, not_null]
      - name: source_player_id
        data_tests: [unique, not_null]
      - name: player_name
        data_tests: [not_null]

  - name: dim_date
    description: Calendar dimension, 1950-01-01 to 2030-12-31.
    columns:
      - name: date_key
        description: yyyymmdd integer.
        data_tests: [unique, not_null]
      - name: date
        data_tests: [unique, not_null]
      - name: iso_day_of_week
        data_tests:
          - accepted_values:
              arguments: {values: [1, 2, 3, 4, 5, 6, 7], quote: false}

  - name: fact_match
    description: One row per available match.
    columns:
      - name: match_key
        data_tests: [unique, not_null]
      - name: source_match_id
        data_tests: [unique, not_null]
      - name: competition_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_competition'), field: competition_key}
      - name: season_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_season'), field: season_key}
      - name: date_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: home_team_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_team'), field: team_key}
      - name: away_team_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_team'), field: team_key}
      - name: result
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [home_win, draw, away_win]}

  - name: fact_shot
    description: One row per shot with StatsBomb xG and derived geometry.
    columns:
      - name: shot_key
        data_tests: [unique, not_null]
      - name: source_event_id
        data_tests: [unique, not_null]
      - name: match_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('fact_match'), field: match_key}
      - name: competition_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_competition'), field: competition_key}
      - name: season_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_season'), field: season_key}
      - name: date_key
        data_tests:
          - relationships:
              arguments: {to: ref('dim_date'), field: date_key}
      - name: team_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_team'), field: team_key}
      - name: player_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_player'), field: player_key}
      - name: xg
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: distance_to_goal
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 130}
      - name: shot_angle
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 3.1416}
