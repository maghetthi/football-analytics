version: 2

models:
  - name: dim_club
    description: One row per club seen in UEFA competitions (identified by normalised name).
    columns:
      - name: club_key
        data_tests: [unique, not_null]
      - name: club_name
        data_tests: [not_null]

  - name: fact_club_match
    description: UEFA club matches (UCL, UEL, UECL), played or scheduled. Regulation-time score.
    columns:
      - name: match_key
        data_tests: [unique, not_null]
      - name: competition_code
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: [UCL, UEL, UECL]}
      - name: kick_off_at
        data_tests: [not_null]
      - name: home_club_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_club'), field: club_key}
      - name: away_club_key
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('dim_club'), field: club_key}
      - name: result
        data_tests:
          - accepted_values:
              arguments: {values: [home_win, draw, away_win]}
      - name: home_goals
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 15}
