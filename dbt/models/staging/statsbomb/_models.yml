version: 2

models:
  - name: base_statsbomb__latest_payload
    description: Newest raw version of each StatsBomb file (one row per resource + key).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [resource, resource_key]

  - name: stg_statsbomb__competitions
    description: Competition/season catalogue. Grain = competition + season.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [competition_id, season_id]
    columns:
      - name: competition_id
        data_tests: [not_null]
      - name: season_id
        data_tests: [not_null]
      - name: competition_name
        data_tests: [not_null]

  - name: stg_statsbomb__matches
    description: One row per match.
    columns:
      - name: match_id
        data_tests: [unique, not_null]
      - name: competition_id
        data_tests: [not_null]
      - name: season_id
        data_tests: [not_null]
      - name: match_date
        data_tests: [not_null]
      - name: home_team_id
        data_tests: [not_null]
      - name: away_team_id
        data_tests: [not_null]
      - name: home_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}
      - name: away_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0}

  - name: stg_statsbomb__lineups
    description: One row per player listed in a match squad.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [match_id, team_id, player_id]
    columns:
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_statsbomb__matches'), field: match_id}
      - name: team_id
        data_tests: [not_null]
      - name: player_id
        data_tests: [not_null]

  - name: stg_statsbomb__events
    description: One row per event (passes, carries, shots, ...), common fields only.
    columns:
      - name: event_id
        data_tests: [unique, not_null]
      - name: match_id
        data_tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_statsbomb__matches'), field: match_id}
      - name: event_type
        data_tests: [not_null]
      - name: period
        data_tests:
          - accepted_values:
              arguments: {values: [1, 2, 3, 4, 5], quote: false}
      # Pitch is 120x80. One shot in Euro 2024 sits at x=120.1 (source imprecision), so allow a
      # 1-unit margin: still catches wrong scales (metres, 0-1) without failing on rounding.
      - name: location_x
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: -1, max_value: 121}
      - name: location_y
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: -1, max_value: 81}

  - name: stg_statsbomb__shots
    description: One row per shot with StatsBomb xG.
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments: {to: ref('stg_statsbomb__events'), field: event_id}
      - name: match_id
        data_tests: [not_null]
      - name: xg
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: outcome
        data_tests: [not_null]
