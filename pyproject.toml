[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analytics"
version = "0.1.0"
description = "Football Analytics Platform: ingestion, warehouse, API, ML"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.5",
]
api = [
    "fastapi>=0.115",
    "redis>=5",
    "uvicorn[standard]>=0.30",
]
flows = [
    "prefect>=3",
]
ml = [
    "joblib>=1.4",
    "matplotlib>=3.9",
    "mlflow>=3",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]
dashboard = [
    "streamlit>=1.40",
]
dbt = [
    "dbt-core>=1.10",
    "dbt-postgres>=1.9",
]

[tool.setuptools.packages.find]
where = ["services/pipeline"]

[tool.pytest.ini_options]
testpaths = ["services/pipeline/tests", "services/api/tests", "services/ml/tests"]
pythonpath = ["services/api", "services/ml"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["football_pipeline", "football_api", "football_ml"]
